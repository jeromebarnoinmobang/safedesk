# Override GPU — Windows / Docker Desktop (WSL2). LOCAL uniquement.
# Applique automatiquement par scripts/up-local.* si /dev/dxg + libd3d12 sont detectes.
services:
  desktop:
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, graphics, video, display]