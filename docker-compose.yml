# Bureau KDE conteneurise — base commune (local + VPS).
# Local : docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
# VPS   : docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
services:
  desktop:
    image: lscr.io/linuxserver/webtop:debian-kde@sha256:2c69b3325b177713ac388fd8c0b95589bc537e938c5ff6e7a5435887fc35d0f6
    container_name: mobang-desktop
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
      - CUSTOM_USER=${DESKTOP_USER:-jerome}
      - PASSWORD=${DESKTOP_PASSWORD:?definis DESKTOP_PASSWORD dans .env}
    volumes:
      - config:/config
    shm_size: "1gb"
    restart: unless-stopped

  # Sidecar Syncthing : replique le home KDE (/config) local <-> VPS (converge au switch).
  home-sync:
    image: syncthing/syncthing@sha256:775c4aac486263ca8653055bba7d3061799281974b706695e17bc798da3f4e92
    container_name: mobang-desktop-sync
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - syncthing-config:/var/syncthing/config
      - config:/sync/home
    restart: unless-stopped

volumes:
  config:
  syncthing-config: