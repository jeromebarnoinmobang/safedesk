name: safedesk

# Bureau KDE conteneurise — base commune (local + VPS).
# Local : docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
# VPS   : docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
services:
  desktop:
    build:
      context: .
      args:
        INSTALL_CHROME: ${INSTALL_CHROME:-false}
        INSTALL_CLAUDE: ${INSTALL_CLAUDE:-false}
    image: mobang/desktop:kde
    container_name: mobang-desktop
    # Hostname FIXE : sans lui, chaque recreation change le nom d hote et les navigateurs
    # refusent d ouvrir leur profil (SingletonLock ecrit l ancien hote -> profil in use).
    hostname: safedesk
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
      - CUSTOM_USER=${DESKTOP_USER:-user}
      - PASSWORD=${DESKTOP_PASSWORD:?definis DESKTOP_PASSWORD dans .env}
    volumes:
      - config:/config
      # Sans GPU, la rasterisation GPU rend des fenetres blanches -> rendu logiciel.
      - ./chromium.d/${RENDER_PROFILE:-zz-no-gpu}:/etc/chromium.d/zz-render:ro
    # 4g : en dessous de 3.8g, Chromium bascule sur --disable-dev-shm-usage (instable).
    shm_size: "4gb"
    restart: unless-stopped

  # Sidecar Syncthing : replique le home KDE (/config) local <-> VPS (converge au switch).
  home-sync:
    image: syncthing/syncthing@sha256:775c4aac486263ca8653055bba7d3061799281974b706695e17bc798da3f4e92
    container_name: mobang-desktop-sync
    hostname: safedesk-sync
    volumes:
      - syncthing-config:/var/syncthing/config
      - config:/sync/home
    restart: unless-stopped

volumes:
  config:
  syncthing-config: