# Override GPU — LOCAL uniquement (le VPS n'a pas de carte graphique).
# Applique automatiquement par scripts/up-local.* si un GPU NVIDIA est detecte ET valide.
# Usage manuel :
#   docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.gpu.yml up -d
services:
  desktop:
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, graphics, video, display]