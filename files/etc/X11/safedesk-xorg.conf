# SafeDesk display for Moonlight touch (SAFEDESK_XORG_TOUCH=1, see svc-xorg/run).
#
# Xorg with the dummy video driver replaces Xvfb because Xvfb cannot host an
# input driver, and only an input driver can give X a real XI2 touch screen.
# The inputtest driver is that touch screen: safedesk-sunshine-input writes
# Moonlight's touches to its socket. Keyboard and mouse keep using XTest.
Section "ServerFlags"
  Option "AutoAddDevices" "false"
  Option "AutoEnableDevices" "false"
  Option "DontVTSwitch" "true"
EndSection

Section "Device"
  Identifier "dummy"
  Driver "dummy"
  # kB: enough for the Virtual size below at 32 bpp
  VideoRam 131072
EndSection

Section "Monitor"
  Identifier "monitor"
  HorizSync 5.0-1000.0
  VertRefresh 5.0-200.0
EndSection

Section "Screen"
  Identifier "screen"
  Device "dummy"
  Monitor "monitor"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    # Selkies and Sunshine resize with RandR (output DUMMY0) up to Virtual.
    Modes "1024x768"
    Virtual 7680 4320
  EndSubSection
EndSection

Section "InputDevice"
  Identifier "SafeDesk touch"
  Driver "inputtest"
  Option "DeviceType" "Touch"
  Option "SocketPath" "/tmp/safedesk-touch.socket"
  Option "TouchCount" "10"
EndSection

Section "ServerLayout"
  Identifier "layout"
  Screen "screen"
  InputDevice "SafeDesk touch"
EndSection
