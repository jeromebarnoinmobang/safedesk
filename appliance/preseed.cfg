#_preseed_ SafeDesk Appliance — installation Debian minimale 100% automatique.
# Cible le plus gros disque NON-AMOVIBLE (= le NVMe 4 To). La cle USB d install (amovible)
# est exclue automatiquement. Verifie que Windows est sur un AUTRE disque interne.

### Langue / clavier
d-i debian-installer/language string fr
d-i debian-installer/country string FR
d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr(latin9)

### Reseau
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string safedesk
d-i netcfg/hostname string safedesk
d-i netcfg/get_domain string local

### Miroir
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Horloge
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris
d-i clock-setup/ntp boolean true

### Comptes : root actif, pas d utilisateur normal (le kiosque est cree par setup.sh)
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false
d-i passwd/root-password password safedesk-root-change-me
d-i passwd/root-password-again password safedesk-root-change-me

### Partitionnement : plus gros disque NON-AMOVIBLE (exclut la cle USB d install)
d-i partman/early_command string \
  DISK=$(list-devices disk | while read d; do b=$(basename $d); rm=$(cat /sys/block/$b/removable 2>/dev/null || echo 1); s=$(cat /sys/block/$b/size 2>/dev/null || echo 0); [ "$rm" = "0" ] && echo "$s $d"; done | sort -rn | head -n1 | cut -d" " -f2); \
  debconf-set partman-auto/disk "$DISK"; \
  debconf-set grub-installer/bootdev "$DISK"
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Logiciels : MINIMAL, aucun bureau
tasksel tasksel/first multiselect ssh-server
d-i pkgsel/include string sudo git curl ca-certificates
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### GRUB
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true

### Fin : cloner SafeDesk + service first-boot qui execute setup.sh
d-i preseed/late_command string \
  in-target sh -c "git clone https://github.com/jeromebarnoinmobang/safedesk.git /opt/safedesk"; \
  in-target install -m644 /opt/safedesk/appliance/safedesk-firstboot.service /etc/systemd/system/safedesk-firstboot.service; \
  in-target systemctl enable safedesk-firstboot.service

### Redemarrage auto sans confirmation
d-i finish-install/reboot_in_progress note