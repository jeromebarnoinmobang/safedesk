name: Deploy SafeDesk VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'files/**'
      - 'deploy/traefik/**'
      - 'scripts/up-remote.sh'
      - '.github/workflows/deploy-vps.yml'

jobs:
  deploy:
    # Production is changed only by the dedicated GitHub Actions worker hosted
    # on the VPS; no interactive deployment path is used.
    runs-on: [self-hosted, mobang, deploy]
    permissions:
      contents: read
    env:
      INSTALL_CHROME: 'true'
      INSTALL_SUNSHINE: 'true'
      SUNSHINE_BIND_IP: ${{ secrets.SAFEDESK_SUNSHINE_BIND_IP }}
    steps:
      - name: Deploy through the dedicated VPS worker
        shell: bash
        run: sudo -n /usr/local/sbin/safedesk-deploy
