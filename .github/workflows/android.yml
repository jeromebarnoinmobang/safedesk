name: Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: 0.1.0)"
        required: false
        default: "0.1.0"
  push:
    tags: ["app-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Cle de signature (secret stable, sinon ephemere)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          KS="$RUNNER_TEMP/safedesk.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            PASS="$KS_PASS"
            echo "Signature: cle stable (secret)"
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" \
              -alias safedesk -dname "CN=SafeDesk" -keyalg RSA -keysize 2048 -validity 3650
            echo "Signature: cle EPHEMERE (definir ANDROID_KEYSTORE_B64 pour une identite stable)"
          fi
          {
            echo "KEYSTORE_FILE=$KS"
            echo "KEYSTORE_PASS=$PASS"
            echo "KEY_PASS=$PASS"
            echo "KEY_ALIAS=safedesk"
          } >> "$GITHUB_ENV"

      - name: Construire l APK
        run: gradle -p android assembleRelease

      - name: Renommer
        id: apk
        run: |
          V="${{ github.event.inputs.version || '0.1.0' }}"
          OUT="SafeDesk-$V.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: safedesk-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.apk.outputs.version }}
          name: "SafeDesk Android ${{ steps.apk.outputs.version }}"
          files: ${{ steps.apk.outputs.file }}
          body: |
            Application Android SafeDesk.

            Installation : telecharger l APK ci-dessous sur le telephone, l ouvrir,
            autoriser l installation, puis scanner votre code SafeDesk.