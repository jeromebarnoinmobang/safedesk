# Override AV — peripheriques USB de l HOTE local dans le bureau, AVEC HOTPLUG :
# brancher/debrancher/rebrancher une camera SUIT dans le conteneur, sans le
# recreer. LOCAL uniquement (le bureau VPS n a pas d USB).
#
# Comment ca marche :
# - /dev:/dev  : on monte le devtmpfs de l hote — un node cree a chaud
#   (/dev/video0 au branchement) APPARAIT dans le conteneur. C est ce que
#   l ancien mapping `devices: /dev/video0` ne permettait pas (node fige a la
#   creation -> obsolete au rebranchement : limite historique LEVEE).
# - device_cgroup_rules : la LISTE BLANCHE de ce que le conteneur a le droit
#   d ouvrir. Cameras V4L2 (major 81) et bus USB brut (189). Les DISQUES de
#   l hote (block devices) ne sont volontairement PAS autorises : brancher une
#   cle USB pour la voir dans le bureau = brique future (udisks2), pas ici.
# - /run/udev:ro : metadonnees udev pour une enumeration propre par les apps.
#
# Le MICRO ne passe PAS par ici : il arrive deja par la redirection RDP du kiosque
# (xfreerdp /microphone:sys:pulse -> module-xrdp-source -> source Pulse "xrdp-source").
# Passer /dev/snd au conteneur CASSERAIT ce partage : l audio ALSA de l hote appartient
# a PipeWire (kiosque), un seul proprietaire hw a la fois.
#
# Acces utilisateur : le gid des nodes vient de l hote -> script
# safedesk-video-groups (rejoint le gid observe au boot, repli gid video=44 si
# aucune camera au boot). Cas residuel : camera branchee apres le boot AVEC un
# gid exotique different -> redemarrer le conteneur une fois.
services:
  desktop:
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      # Donne a abc l acces aux nodes video (gid HOTE inconnu d avance -> script).
      - ./files/custom-cont-init.d/safedesk-video-groups:/custom-cont-init.d/safedesk-video-groups:ro
    device_cgroup_rules:
      - 'c 81:* rmw'   # cameras V4L2 (/dev/video*)
      - 'c 189:* rmw'  # bus USB brut (libusb : scanners, lecteurs...)
