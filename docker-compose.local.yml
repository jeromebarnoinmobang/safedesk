# Override LOCAL : bureau + GUI Syncthing sur localhost UNIQUEMENT.
# Usage : docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
services:
  desktop:
    ports:
      - "127.0.0.1:3000:3000"     # http://localhost:3000
    environment:
      # Latence bureau (loopback) : H.264 continu pixelflux, 60 fps, bitrate haut, full color.
      # Le bureau devient bien plus reactif qu'en mode paint-over JPEG par defaut.
      SELKIES_ENCODER: "x264enc"
      SELKIES_H264_STREAMING_MODE: "true"
      SELKIES_FRAMERATE: "60"
      SELKIES_VIDEO_BITRATE: "30"
      SELKIES_H264_FULLCOLOR: "true"
  home-sync:
    ports:
      - "127.0.0.1:8384:8384"     # GUI/API Syncthing (local dials out vers le VPS)