# Override VPS (mobang-prod) : PAS de port publie — Traefik route + HTTPS.
# Usage : docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# Aligne sur la prod mobang (Traefik v3, /opt/mobang/traefik/traefik.yml) :
#   entrypoint   = websecure (:443)
#   certresolver = letsencrypt (tlsChallenge) -> le sous-domaine doit pointer sur le VPS
#   reseau externe partage avec Traefik = "second-brain"
#   middleware d'en-tetes de securite deja defini cote Traefik = security-headers@file
# Auth : fournie par webtop lui-meme (CUSTOM_USER/PASSWORD), servie sous HTTPS.
services:
  desktop:
    networks:
      - second-brain
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.desktop.rule=Host(`${DESKTOP_DOMAIN:?definis DESKTOP_DOMAIN dans .env}`)"
      - "traefik.http.routers.desktop.entrypoints=websecure"
      - "traefik.http.routers.desktop.tls.certresolver=letsencrypt"
      - "traefik.http.routers.desktop.middlewares=security-headers@file"
      - "traefik.http.services.desktop.loadbalancer.server.port=3000"

networks:
  second-brain:
    external: true