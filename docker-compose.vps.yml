# Override VPS (mobang-prod) : Traefik route le bureau (HTTPS), Syncthing ouvre 22000.
# Usage : docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# Traefik v3 (/opt/mobang/traefik/traefik.yml) : entrypoint websecure, certresolver letsencrypt
# (tlsChallenge -> le sous-domaine doit pointer sur le VPS), reseau externe "second-brain",
# middleware d'en-tetes deja defini = security-headers@file. Auth = webtop (CUSTOM_USER/PASSWORD).
services:
  desktop:
    networks:
      - second-brain
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.desktop.rule=Host(`${DESKTOP_DOMAIN:?definis DESKTOP_DOMAIN dans .env}`)"
      - "traefik.http.routers.desktop.entrypoints=websecure"
      - "traefik.http.routers.desktop.tls.certresolver=letsencrypt"
      - "traefik.http.routers.desktop.middlewares=security-headers@file"
      - "traefik.http.services.desktop.loadbalancer.server.port=3000"
  home-sync:
    ports:
      - "127.0.0.1:8384:8384"     # API via SSH sur le VPS
      - "22000:22000/tcp"         # sync entrant depuis le local (ouvrir UFW)
      - "22000:22000/udp"

networks:
  second-brain:
    external: true